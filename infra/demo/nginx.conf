# nginx interno de la imagen web. Es el único contenedor con puerto publicado; el TLS lo pone el
# proxy del VPS (Nginx Proxy Manager) delante de este puerto.

# Protocolo original: el que informa el proxy del VPS, o el de esta conexión.
map $http_x_forwarded_proto $protocolo {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Lote de sincronización: hasta 5 MB (doc. 03 §8).
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # MapLibre usa workers y blobs; todo lo demás sale del mismo origen.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; child-src blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $protocolo;
        proxy_read_timeout 120s;
    }

    # Subida reanudable (tus). Sin búfer: los trozos pasan directo a tusd.
    location /files/ {
        proxy_pass http://tusd:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 30m;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $protocolo;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Lectura de archivos con URL firmada (≤ 15 min). Solo lectura: la firma la valida MinIO con
    # el mismo Host con que la API la emitió.
    location /archivos/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }

    # Mapa base opcional: se monta en /srv/mapa. Si no existe, la web muestra solo los puntos.
    location = /mapa/base.pmtiles {
        alias /srv/mapa/base.pmtiles;
        default_type application/octet-stream;
    }

    # El worker de MapLibre es un módulo .mjs; el mime.types de nginx no lo conoce y el navegador
    # rechaza un worker servido como application/octet-stream.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
    }

    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri /index.html;
    }
}
