# Las PoC de poc/ tienen su propio lockfile y no son parte del monorepo.
packages:
  - apps/*
  - packages/*

# Scripts de instalación: bloqueados salvo que se aprueben aquí.
# ssh2 y cpu-features (aceleración nativa opcional) y protobufjs (solo verifica versiones) vienen de Testcontainers y no hacen falta.
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.18'
  - '@better-auth/drizzle-adapter@1.7.18'
  - '@better-auth/kysely-adapter@1.7.18'
  - '@better-auth/memory-adapter@1.7.18'
  - '@better-auth/mongo-adapter@1.7.18'
  - '@better-auth/prisma-adapter@1.7.18'
  - '@better-auth/telemetry@1.7.18'
  - '@fastify/cors@11.4.1'
  - better-auth@1.7.18
  - '@aws-sdk/client-s3@3.1163.0'
  - pg-boss@12.38.1
  - '@aws-sdk/s3-request-presigner@3.1163.0'
  - '@tanstack/query-core@5.106.1'
  - '@tanstack/react-query@5.106.1'
  - vite@8.3.6
