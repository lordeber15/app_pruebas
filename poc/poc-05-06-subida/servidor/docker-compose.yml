# Solo para esta prueba: credenciales locales generadas por scripts/servidor.sh.
services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${POC_S3_USUARIO:?falta correr scripts/servidor.sh}
      MINIO_ROOT_PASSWORD: ${POC_S3_CLAVE:?falta correr scripts/servidor.sh}
    volumes:
      - datos:/data
  crear-bucket:
    image: amazon/aws-cli@sha256:d557b3524475d70dd3104cf44d96568ee3188897b73a6ece2b37aa50e1af362f
    depends_on:
      minio:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${POC_S3_USUARIO}
      AWS_SECRET_ACCESS_KEY: ${POC_S3_CLAVE}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c", "until aws --endpoint-url http://minio:9000 s3 ls s3://archivos || aws --endpoint-url http://minio:9000 s3 mb s3://archivos; do sleep 1; done"]
  tusd:
    image: tusproject/tusd@sha256:7b1c552a8b42f4b36cb01f2a3bd49f82ab078b2eefd191459e716141dd50376c
    depends_on:
      crear-bucket:
        condition: service_completed_successfully
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${POC_S3_USUARIO}
      AWS_SECRET_ACCESS_KEY: ${POC_S3_CLAVE}
      AWS_REGION: us-east-1
    # Doc. 03 §10: trozos de 5 MB y un maximo de 25 MB por archivo.
    command:
      - -s3-bucket=archivos
      - -s3-endpoint=http://minio:9000
      - -s3-part-size=5242880
      - -max-size=26214400
      - -base-path=/files/
    ports:
      - "1080:8080"
volumes:
  datos:
